name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  maven-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Part 1 tests
        run: mvn -B -ntp test
        working-directory: part1
      - name: Run Part 2 tests
        run: mvn -B -ntp test
        working-directory: part2
      - name: Verify five-replica failover
        run: bash part2/integration_test.sh
